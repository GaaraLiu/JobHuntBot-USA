[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhuntbot"
version = "0.1.0"
description = "A local, explainable job-matching core for the JobHuntBot workflow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
jobhuntbot = "jobhuntbot.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobhuntbot = ["resources/*.json"]

